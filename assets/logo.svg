<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="badgeBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#142442"/>
      <stop offset="50%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Cyan Border Gradient -->
    <linearGradient id="cyanBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <!-- Camera Body Top Highlights (Platinum Silver) -->
    <linearGradient id="silverPlate" x1="120" y1="130" x2="390" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Camera Main Body (Solid high contrast dark navy) -->
    <linearGradient id="bodyDark" x1="100" y1="160" x2="412" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2B45"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>

    <!-- Lens Metallic Bezel -->
    <linearGradient id="lensRingGrad" x1="180" y1="180" x2="330" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Lens Glass Radial Depth -->
    <radialGradient id="glassRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="35%" stop-color="#0052A3"/>
      <stop offset="75%" stop-color="#021430"/>
      <stop offset="100%" stop-color="#000612"/>
    </radialGradient>

    <!-- Stream Waves Vibrant Gradient -->
    <linearGradient id="streamWaveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
  </defs>

  <!-- 1. BASE SQUIRCLE WITH VIVID GLOWING BORDER -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#badgeBg)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#cyanBorder)" stroke-width="6"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- 2. STREAM BROADCAST WAVES (TOP RIGHT - HIGH VISIBILITY) -->
  <!-- Arc 1 (Inner Wave) -->
  <path d="M 346 116 A 90 90 0 0 1 424 194" fill="none" stroke="url(#streamWaveGrad)" stroke-width="11" stroke-linecap="round"/>
  <!-- Arc 2 (Middle Wave) -->
  <path d="M 374 88 A 126 126 0 0 1 458 172" fill="none" stroke="url(#streamWaveGrad)" stroke-width="11" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Arc 3 (Outer Wave) -->
  <path d="M 402 60 A 162 162 0 0 1 490 148" fill="none" stroke="url(#streamWaveGrad)" stroke-width="11" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Broadcast Signal Transmitter Origin -->
  <circle cx="318" cy="142" r="8" fill="#00F0FF"/>
  <circle cx="318" cy="142" r="16" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- 3. CAMERA TOP VIEW-FINDER & CONTROLS -->
  <!-- Top Prism -->
  <path d="M 198 150 L 222 108 L 290 108 L 314 150 Z" fill="#2A3B5C" stroke="#00F0FF" stroke-width="2.5"/>
  <rect x="236" y="98" width="40" height="10" rx="3" fill="#E2E8F0"/>

  <!-- Shutter Button (Left) -->
  <rect x="112" y="134" width="28" height="18" rx="4" fill="#E2E8F0"/>
  <rect x="116" y="126" width="20" height="8" rx="2" fill="#FFFFFF"/>

  <!-- Mode Dial (Right) -->
  <rect x="348" y="136" width="30" height="16" rx="3" fill="#64748B"/>
  <line x1="358" y1="138" x2="358" y2="150" stroke="#0F172A" stroke-width="2"/>
  <line x1="368" y1="138" x2="368" y2="150" stroke="#0F172A" stroke-width="2"/>

  <!-- 4. CAMERA MAIN BODY -->
  <!-- Main Chassis -->
  <rect x="80" y="150" width="352" height="250" rx="36" fill="url(#bodyDark)"/>
  <rect x="80" y="150" width="352" height="250" rx="36" fill="none" stroke="#475569" stroke-width="3"/>

  <!-- Top Platinum Bevel Plate -->
  <path d="M 82 186 C 82 168 96 152 114 152 L 398 152 C 416 152 430 168 430 186 L 430 196 L 82 196 Z" fill="url(#silverPlate)"/>
  <line x1="82" y1="196" x2="430" y2="196" stroke="#00F0FF" stroke-width="2"/>

  <!-- Ergonomic Leather Grip on Left -->
  <path d="M 80 196 L 130 196 L 130 398 L 114 398 C 96 398 80 382 80 364 Z" fill="#141E30"/>
  <line x1="130" y1="196" x2="130" y2="398" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Grip horizontal tactile ridges -->
  <g stroke="#00F0FF" stroke-width="2" stroke-opacity="0.3">
    <line x1="94" y1="240" x2="118" y2="240"/>
    <line x1="94" y1="270" x2="118" y2="270"/>
    <line x1="94" y1="300" x2="118" y2="300"/>
    <line x1="94" y1="330" x2="118" y2="330"/>
    <line x1="94" y1="360" x2="118" y2="360"/>
  </g>

  <!-- 5. CENTRAL OPTICAL LENS (HIGH CONTRAST & DEPTH) -->
  <!-- Center: (cx=276, cy=286) -->

  <!-- Outer Lens Mount Rim -->
  <circle cx="276" cy="286" r="98" fill="#0A0F1D" stroke="#334155" stroke-width="4"/>

  <!-- Metallic Focus Ring -->
  <circle cx="276" cy="286" r="90" fill="none" stroke="url(#lensRingGrad)" stroke-width="7"/>

  <!-- Bright Electric Cyan Ring -->
  <circle cx="276" cy="286" r="80" fill="#060A14" stroke="#00F0FF" stroke-width="4"/>

  <!-- 6 Geometric Aperture Iris Blades (Crisp & High Contrast) -->
  <g stroke="#00F0FF" stroke-width="1.8" fill="#101D33">
    <path d="M 276 216 L 318 244 L 302 286 Z"/>
    <path d="M 318 244 L 332 296 L 288 304 Z"/>
    <path d="M 332 296 L 304 340 L 276 312 Z"/>
    <path d="M 304 340 L 252 352 L 250 304 Z"/>
    <path d="M 252 352 L 216 324 L 246 286 Z"/>
    <path d="M 216 324 L 216 270 L 260 264 Z"/>
    <path d="M 216 270 L 246 226 L 276 254 Z"/>
    <path d="M 246 226 L 298 216 L 302 264 Z"/>
  </g>

  <!-- Deep Blue Multi-Coated Optical Glass Core -->
  <circle cx="276" cy="286" r="50" fill="url(#glassRadial)"/>
  <circle cx="276" cy="286" r="50" fill="none" stroke="#00F0FF" stroke-width="2.5"/>

  <!-- Bright Cyan & Violet Optical Coating Reflections -->
  <path d="M 244 252 A 40 40 0 0 1 308 252 A 42 34 0 0 0 244 252 Z" fill="#00F0FF" fill-opacity="0.6"/>
  <path d="M 244 320 A 40 40 0 0 1 308 320 A 42 34 0 0 0 244 320 Z" fill="#A855F7" fill-opacity="0.5"/>

  <!-- Central Optical Core Pupil & Highlights -->
  <circle cx="276" cy="286" r="22" fill="#020817" stroke="#00F0FF" stroke-width="2.5"/>
  <circle cx="276" cy="286" r="9" fill="#00F0FF"/>
  <circle cx="258" cy="268" r="6" fill="#FFFFFF"/>
  <circle cx="266" cy="260" r="3" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- 6. HIGH-CONTRAST LIVE BROADCAST PILL (TOP RIGHT OF CAMERA) -->
  <rect x="332" y="162" width="84" height="24" rx="6" fill="#0A0E1A" stroke="#FF1E4B" stroke-width="2"/>
  <circle cx="346" cy="174" r="5" fill="#FF1E4B"/>
  <text x="358" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="2">LIVE</text>

  <!-- 7. CLEAN TYPOGRAPHY (CAM MOON PRO) -->
  <text x="256" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    CAM MOON <tspan fill="#00F0FF">PRO</tspan>
  </text>
  <text x="256" y="462" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#94A3B8" text-anchor="middle" letter-spacing="3">
    4K USB WEBCAM
  </text>
</svg>